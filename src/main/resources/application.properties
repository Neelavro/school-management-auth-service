spring.application.name=auth-service
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_service_db}
spring.datasource.username=${DB_USERNAME:technonix}
spring.datasource.password=${DB_PASSWORD:Technonix@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:22349a84-1f39-4265-802e-87dbc47c90ef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
