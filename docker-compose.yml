services:
  db:
    image: mysql:8.0
    container_name: auth-service-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auth_service_db
      MYSQL_USER: ${DB_USERNAME:-technonix}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Technonix@123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: auth-service-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/auth_service_db
      DB_USERNAME: ${DB_USERNAME:-technonix}
      DB_PASSWORD: ${DB_PASSWORD:-Technonix@123}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-22349a84-1f39-4265-802e-87dbc47c90ef}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
